# ---------------------------------------------------------------------------
# GitHub Actions 工作流：自动构建并部署个人网站到 GitHub Pages
# 触发条件：每次推送到 main 分支
# 流程：签出代码 -> 安装依赖 -> 构建静态站点 -> 上传产物 -> 部署到 Pages
# ---------------------------------------------------------------------------
name: Deploy to GitHub Pages

# 触发时机：推送到 main 分支 或 手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的权限
permissions:
  contents: read          # 读取仓库内容
  pages: write            # 写入 Pages
  id-token: write         # 用于 Pages 部署的身份令牌

# 并发控制：同一时间只允许一次部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 签出代码到工作区
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 准备 Node.js 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. 安装项目依赖
      - name: Install dependencies
        run: npm ci

      # 4. 构建静态站点（产物输出到 dist 目录）
      - name: Build
        run: npm run build

      # 5. 配置 Pages 上传组件所需的静态站点路径
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. 将构建产物打包为 Pages 工件
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build               # 等待 build 任务完成
    environment:
      name: github-pages
    steps:
      # 7. 将工件部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4